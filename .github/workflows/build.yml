name: Build RX2040W Firmware (Pico W)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout RX2040W
      uses: actions/checkout@v4
      with:
        ref: codex/add-ws2812b-bluetooth-pairing-indicator

    - name: Install Pico SDK and Tools
      uses: raspberrypi/pico-sdk-tools/installer@main
      with:
        sdk-version: '2.3.0'

    - name: Configure CMake for Pico W
      run: |
        cmake -S . -B build -DPICO_BOARD=pico_w -DCMAKE_BUILD_TYPE=Release

    - name: Build Firmware
      run: |
        cmake --build build -j$(nproc)

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rx2040w-pico_w-uf2
        path: build/*.uf2
        if-no-files-found: error
